name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Tests (Pytest)
        env:
          # Les tests utilisent SQLite et des services mocks par dfaut via conftest.py
          # Ces variables sont dfinies par scurit pour s'assurer que le pipeline 
          # ne bloque pas si conftest.py venait  changer.
          DATABASE_URL: "sqlite:///./test_cv.db"
          JWT_SECRET_KEY: "test-secret-key-not-for-production"
          PASSWORD_RESET_DEV_MODE: "true"
        run: |
          pytest -q --strict-markers

  docker-check:
    name: Docker Build Validation
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t cv-generator:ci-test .

